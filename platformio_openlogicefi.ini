[env]
; PlatformIO scans source subdirectories recursively. Stock builds must not
; compile variant replacements alongside the original firmware sources.
build_src_filter =
    +<*>
    -<variants/>

[env:MEGA32]
; Keep MEGA32 self-contained so the main platformio.ini can follow Speeduino releases.
framework = arduino
board = black_f407ve
board_build.core = stm32

; Core 3.x changes the interrupt API and conflicts with STM32duino RTC 1.2.0.
; Keep this firmware on STM32 Arduino core 2.6.0.
platform = ststm32@17.0.0

board_build.variant = MEGA32
board_build.variants_dir = variants

; Preserve the dependencies previously inherited from black_F407VE and common.
; RTC is fixed to 1.2.0 because newer versions fail to keep time on this setup.
lib_deps =
    stm32duino/STM32duino RTC @ 1.2.0
    greiman/SdFat
    elapsedMillis
    wizard97/SimplyAtomic@^1.0
    adbancroft/avr-fast-shift@^1.1.0
    ridiculousfish/libdivide@^5.2.0
    frankboesing/FastCRC@^1.41
    adbancroft/avr-fast-div@^1.4.0

build_flags =
    -DUSE_LIBDIVIDE -std=c++14 -UBOARD_MAX_IO_PINS -DENABLE_HWSERIAL2 -DENABLE_HWSERIAL3 -DUSBCON -DHAL_PCD_MODULE_ENABLED -DUSBD_USE_CDC -DHAL_CAN_MODULE_ENABLED -DSERIAL_TX_BUFFER_SIZE=128 -DSERIAL_RX_BUFFER_SIZE=128
    -DOPENLOGICEFI_MEGA32
    -Ivariants/MEGA32
    -Ispeeduino/variants/MEGA32

build_src_filter =
    +<*>
    -<variants/>
    -<init.cpp>
    +<variants/MEGA32/init.cpp>
    -<board_stm32_official.cpp>
    +<variants/MEGA32/board_stm32_official.cpp>
    -<rtc_common.cpp>
    +<variants/MEGA32/rtc_common.cpp>

upload_protocol = dfu
debug_tool = stlink
monitor_speed = 115200
test_build_src = yes
