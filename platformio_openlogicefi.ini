[env:MEGA32]
extends = env:black_F407VE

; Core 3.x changes the interrupt API and conflicts with STM32duino RTC 1.2.0.
; Keep this firmware on STM32 Arduino core 2.6.0.
platform = ststm32@17.0.0

board_build.variant = MEGA32
board_build.variants_dir = variants

build_flags =
    ${env:black_F407VE.build_flags}
    -DOPENLOGICEFI_MEGA32
    -Ivariants/MEGA32
    -Ispeeduino/variants/MEGA32

build_src_filter =
    +<*>
    -<init.cpp>
    +<variants/MEGA32/init.cpp>
